<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="60%" style="stop-color:#2a5f8f"/>
      <stop offset="100%" style="stop-color:#87CEEB"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#skyGrad)"/>
  <!-- Skyline silhouette -->
  <rect x="60" y="280" width="40" height="320" fill="#0A2647" rx="2"/>
  <rect x="110" y="200" width="35" height="400" fill="#0E3460" rx="2"/>
  <rect x="155" y="320" width="50" height="280" fill="#0A2647" rx="2"/>
  <rect x="220" y="150" width="30" height="450" fill="#144272" rx="2"/>
  <rect x="260" y="250" width="55" height="350" fill="#0A2647" rx="2"/>
  <!-- Burj Khalifa style -->
  <polygon points="380,60 390,600 370,600" fill="#0E3460"/>
  <rect x="372" y="80" width="16" height="520" fill="#144272" rx="1"/>
  <polygon points="380,40 386,100 374,100" fill="#144272"/>
  <!-- More buildings -->
  <rect x="420" y="220" width="60" height="380" fill="#0A2647" rx="3"/>
  <rect x="490" y="300" width="45" height="300" fill="#0E3460" rx="2"/>
  <rect x="545" y="180" width="50" height="420" fill="#144272" rx="3"/>
  <rect x="610" y="260" width="40" height="340" fill="#0A2647" rx="2"/>
  <rect x="660" y="200" width="55" height="400" fill="#0E3460" rx="3"/>
  <rect x="725" y="280" width="45" height="320" fill="#0A2647" rx="2"/>
  <rect x="780" y="160" width="35" height="440" fill="#144272" rx="2"/>
  <rect x="830" y="240" width="50" height="360" fill="#0A2647" rx="3"/>
  <rect x="890" y="300" width="40" height="300" fill="#0E3460" rx="2"/>
  <!-- Water reflection -->
  <rect x="0" y="520" width="960" height="80" fill="rgba(10,38,71,0.4)"/>
  <!-- Lights on buildings -->
  <rect x="430" y="240" width="4" height="4" fill="#FFD700" opacity="0.7"/>
  <rect x="440" y="280" width="4" height="4" fill="#FFD700" opacity="0.5"/>
  <rect x="555" y="200" width="4" height="4" fill="#FFD700" opacity="0.6"/>
  <rect x="670" y="230" width="4" height="4" fill="#FFD700" opacity="0.7"/>
  <rect x="790" y="190" width="4" height="4" fill="#FFD700" opacity="0.5"/>
  <rect x="845" y="270" width="4" height="4" fill="#FFD700" opacity="0.6"/>
</svg>
